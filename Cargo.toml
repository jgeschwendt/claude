[package]
name = "claude-home"
version = "0.1.0"
edition = "2024"
publish = false
description = "Claude Code home tooling: the statusline renderer"

[[bin]]
name = "statusline"
path = "src/bin/statusline.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
